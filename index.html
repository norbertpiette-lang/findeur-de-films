      const utf8B64 = (s) => { const bytes = new TextEncoder().encode(s); let bin = ""; bytes.forEach((c) => { bin += String.fromCharCode(c); }); return btoa(bin); };
      const utf8UnB64 = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0)));

      // stock bonus : recommandations générées hors catalogue par la tâche planifiée « pool »
      let poolCache = null;
      // synthèse du profil cinéphile : régénérée chaque matin par la tâche planifiée (profil.json du dépôt de données)
      let profilTxt = null;
      const loadProfil = async () => {
        if (profilTxt !== null) return;
        try {
          const tok = getToken();

          if (!r.ok) return;

          const bin = atob((j.content || "").replace(/\s/g, ""));

        } catch (e) { profilTxt = ""; }
      };
      const loadPool = async () => {
        if (poolCache !== null) return;
        try {
          const tok = getToken();
          if (!tok) { poolCache = []; return; } // dépôt privé : sans token, pas de pool
          const r = await fetch(`https://api.github.com/repos/${SYNC.owner}/${SYNC.dataRepo}/contents/pool.json?ref=${SYNC.branch}`, { headers: { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json" } });
          if (!r.ok) { poolCache = []; return; }
          const j = await r.json();
          const bin = atob((j.content || "").replace(/\s/g, ""));
          const txt = new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));

        } catch (e) { poolCache = []; }
      };
      const POOL_SEEN_KEY = "findeur-pool-seen";
      const getPoolSeen = () => { try { return JSON.parse(localStorage.getItem(POOL_SEEN_KEY) || "[]"); } catch (e) { return []; } };
      const addPoolSeen = (t) => { try { const l = getPoolSeen(); if (!l.includes(t)) { l.push(t); localStorage.setItem(POOL_SEEN_KEY, JSON.stringify(l)); } } catch (e) {} };
      // auto-adoption : un film du pool choisi « À voir », vu ou noté rejoint le stock personnel (persistant, synchronisé)
      const ADOPT_KEY = "findeur-adopted";
      const getAdopted = () => { try { const l = JSON.parse(localStorage.getItem(ADOPT_KEY) || "[]"); return Array.isArray(l) ? l : []; } catch (e) { return []; } };
      const setAdopted = (l) => { try { localStorage.setItem(ADOPT_KEY, JSON.stringify(l)); } catch (e) {} };
      const ALL_FILMS = () => FILMS.concat(getAdopted());
      const isPoolFilm = (t) => (poolCache || []).some((f) => f.t === t);
      const adopt = (t) => {
        const f = (poolCache || []).find((x) => x.t === t);
        if (!f) return;
        const l = getAdopted();
        if (!l.some((x) => x.t === t)) { l.push(f); setAdopted(l); save(); schedulePush(); }
      };
      // adoption directe d'un objet film (ajout manuel « J'ai vu un film ») : le film rejoint le stock personnel
      const adoptRaw = (f) => {
        const l = getAdopted();
        if (!l.some((x) => x.t === f.t)) { l.push(f); setAdopted(l); save(); schedulePush(); }
      };

      let state = { etape:0, debutMin:null, coucheMin:null, noTime:false, genre:null, envie:null, ambianceNote:"", envieNote:"", filters:{big:false, plateformes:[]}, seen:[], seenMap:{}, seenDel:{}, indispo:{}, comments:{}, pickHistory:{}, ratings:{}, pick:null };
      try { const saved = JSON.parse(localStorage.getItem(LS) || "null"); if (saved) state = Object.assign(state, saved, {pick:null}); } catch (e) {}
      // film marqué « vu » depuis la liste « À voir » : il y reste visible 30 minutes avec ses étoiles (fenêtre pour le noter sur place),
      // et la notation n'efface pas la fiche immédiatement : elle reste encore 30 minutes après les étoiles, le temps d'ajouter un commentaire (💬).
      // après ce délai la fiche sort automatiquement des listes « À voir » (et des suggestions). Si « Pas vu » est annulé à temps, le film redevient « À voir ».
      // film « À voir » ou des suggestions marqué « indisponible » 🚫 : il reste 30 minutes visible, puis en sort automatiquement.
      // le masquage durable des suggestions, lui, dure 3 mois à compter du marquage.
      const PICK_DELAY = 30 * 60 * 1000;
      const pickSeenRecent = (t) => { const at = state.seenMap?.[t]; return state.seen.includes(t) && at != null && (Date.now() - at) < PICK_DELAY; };
      const pickRatedRecent = (t) => { const r = state.ratings?.[t]; return !!r && r.at != null && (Date.now() - r.at) < PICK_DELAY; };
      const pickIndispoRecent = (t) => { const at = state.indispo?.[t]; return at != null && (Date.now() - at) < PICK_DELAY; };
      const prunePicks = () => {
        let changed = false;
        Object.keys(state.pickHistory || {}).forEach((t) => {
          const at = state.seenMap?.[t];
          if (state.seen.includes(t) && at != null && Date.now() - at >= PICK_DELAY && !pickRatedRecent(t)) { delete state.pickHistory[t]; changed = true; }
          if (state.indispo[t] != null && Date.now() - state.indispo[t] >= PICK_DELAY) { delete state.pickHistory[t]; changed = true; } // indisponible depuis 30 min : sortie de « À voir »
        });
        return changed;
      };
      const IND_DELAY = 90 * 864e5; // rétention indisponibilité : 3 mois
      // critères communs de sélection (utilisés par les suggestions ET la liste des films déjà vus)
      const SELECTION_OK = (f) => {
        const ALLOWED = ["Netflix", "Prime Video", "Apple TV+", "Sooner", "VOD", "Apple TV Store", "Arte", "YouTube", "Cinéma"];
        const isWE = [5, 6, 0].includes(new Date().getDay());
        return f.p.some(p => ALLOWED.includes(p)) &&
          !(f.p.includes("Cinéma") && !isWE);
      };
      // films déjà vus de l'ambiance courante
      const seenInSelection = () => ALL_FILMS().filter((f) => f.g === state.genre && state.seen.includes(f.t));
      const isIndispo = (t) => (state.indispo?.[t] || 0) > 0 && Date.now() - state.indispo[t] < IND_DELAY;
      // migration ancien format : seen [] → seenMap avec horodatage 0
      if (!state.seenMap && Array.isArray(state.seen)) {
        state.seenMap = Object.fromEntries(state.seen.map((t) => [t, 0]));
        state.seenDel = state.seenDel || {};
      }
      // vu = ajouté plus récemment que retiré
      const recomputeSeen = () => {
        state.seen = Object.keys(state.seenMap || {}).filter((t) => (state.seenMap[t] || 0) > (state.seenDel?.[t] ?? -1));
      };
      recomputeSeen();

      const save = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} };

      // purge héritée des problèmes d'encodage (Ã©, ï¿½…) : répare les accents, fusionne les doublons, à chaque chargement
      const MOJI = /Ã|ï¿½|\uFFFD|Â|ƒ|Ò©|©|Ò|¿|½|Æ|†|€|™/;
      const fixMojibake = (s) => {
        if (!MOJI.test(s)) return s;
        // règles ciblées d'abord (ex. « cinÒ© » → « ciné ») : un décodage UTF-8 prématuré transformerait Ò© en caractère cyrillique irrécupérable
        const pass = (x) => x.replace(/Ò©/g, "é").replace(/éƒ©/g, "é").replace(/ï¿½|\uFFFD/g, "é").replace(/Ã©/g, "é").replace(/Ã¨/g, "è").replace(/Ã¯/g, "ï").replace(/Ãª/g, "ê").replace(/Ã¢/g, "â").replace(/Ã¹/g, "ù").replace(/ƒ©/g, "é").replace(/Ã/g, "é").replace(/ƒ/g, "").replace(/Â/g, "");
        let out = pass(pass(s)); // deux passages : certaines séquences se reforment après le premier
        if (!MOJI.test(out) && !out.includes("\uFFFD")) return out; // réparé
        // sinon : tentative de décodage UTF-8 sur l'original, puis re-passe
        try { const dec = new TextDecoder().decode(Uint8Array.from(s, (c) => c.charCodeAt(0))); const fin = pass(pass(dec)); if (fin !== s && !MOJI.test(fin) && !fin.includes("\uFFFD")) return fin; } catch (e) {}
        return out; // meilleur état atteint même imparfait — la fusion des familles éliminera la clé
      };
      const purgeMojibake = () => {
        let changed = false;
        const maps = ["ratings", "comments", "seenMap", "seenDel", "pickHistory"];
        const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
        const gnorm = (s) => norm(String(s).replace(/ï¿½|\uFFFD/g, "e")); // joker : le caractère perdu vaut « e » (é/è)
        // 1. FUSION D'ABORD : familles = clés à norme identique (même film à accents près, ex. « Derriére »/« Derrière », même sans mojibake), ou préfixes compatibles si l'une est suspecte
        const known = new Set(FILMS.map((f) => f.t));
        try { getAdopted().forEach((f) => known.add(f.t)); (poolCache || []).forEach((f) => known.add(f.t)); getPoolSeen().forEach((t) => known.add(t)); } catch (e) {}
        maps.forEach((m) => {
          const o = state[m] || {};
          const keys = Object.keys(o);
          const parent = {}; keys.forEach((k) => { parent[k] = k; });
          const find = (k) => { while (parent[k] !== k) k = parent[k]; return k; };
          const uni = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) { parent[rb] = ra; changed = true; } };
          for (let i = 0; i < keys.length; i++) for (let j = i + 1; j < keys.length; j++) {
            const a = keys[i], b = keys[j];
            const na = gnorm(a), nb = gnorm(b);
            const pa = na.slice(0, 10), pb = nb.slice(0, 10);
            const squelette = (x) => x.replace(/[aeiouy]/g, "");
            const memeFilm = na !== "" && na === nb; // norme identique : doublon d'accent, même sans caractère mojibake
            const accentDeplace = na !== "" && pa === pb && squelette(na) === squelette(nb); // squelette consonnes identique : accent déplacé (í→é, è→é)
            const prefixe = (MOJI.test(a) || MOJI.test(b)) && pa && pb && (pa === pb || nb.includes(pa) || na.includes(pb));
            if (memeFilm || accentDeplace || prefixe) uni(a, b);
          }
          const familles = {};
          keys.forEach((k) => { const r = find(k); (familles[r] = familles[r] || []).push(k); });
          Object.values(familles).forEach((g) => {
            if (g.length < 2) return;
            // clé canonique : d'abord un titre connu (catalogue/stock/pool), sinon une clé saine, sinon la plus récente
            const at = (k) => (o[k] && o[k].at) || o[k] || 0;
            const cleans = g.filter((k) => !MOJI.test(k));
            const keep = g.find((k) => known.has(k)) || cleans.slice().sort((x, y) => at(y) - at(x))[0] || g.slice().sort((x, y) => at(y) - at(x))[0];
            g.forEach((k) => {
              if (k === keep) return;
              const ka = (o[k] && o[k].at) || o[k] || 0, kb = (o[keep] && o[keep].at) || o[keep] || 0;
              if (o[keep] === undefined || ka > kb) o[keep] = o[k];
              delete o[k]; changed = true;
            });
            if (MOJI.test(keep)) { const nk = fixMojibake(keep); if (nk !== keep) { if (o[nk] === undefined) o[nk] = o[keep]; else { const ta = (o[keep] && o[keep].at) || o[keep] || 0, tb = (o[nk] && o[nk].at) || o[nk] || 0; if (ta > tb) o[nk] = o[keep]; } delete o[keep]; changed = true; } }
          });
        });
        // 2. PUIS RÉPARATION des clés restantes et des textes
        maps.forEach((m) => {
          const o = state[m] || {};
          Object.keys(o).forEach((k) => {
            const nk = fixMojibake(k); if (nk === k) return;
            if (o[nk] === undefined) o[nk] = o[k];
            else { const ta = (o[k] && o[k].at) || o[k] || 0, tb = (o[nk] && o[nk].at) || o[nk] || 0; if (ta > tb) o[nk] = o[k]; }
            delete o[k]; changed = true;
          });
        });
        Object.values(state.comments || {}).forEach((c) => { if (c && c.text) { const nt = fixMojibake(c.text); if (nt !== c.text) { c.text = nt; changed = true; } } });
        // 2bis. ALIGNEMENT vu/retiré : un film retiré sous une orthographe et « vu » sous une variante = un seul film (norme identique)
        {
          const sm = state.seenMap || {}, sd = state.seenDel || {};
          Object.keys(sm).forEach((k1) => {
            Object.keys(sd).forEach((k2) => {
              if (k1 === k2) return; // même clé : recomputeSeen tranche déjà
              const n1 = norm(k1), n2 = norm(k2);
              if (!n1 || n1 !== n2) return;
              if ((sd[k2] || 0) >= (sm[k1] || 0)) { delete sm[k1]; changed = true; } // le retrait est plus récent : pas vu
              else { delete sd[k2]; changed = true; } // le vu est plus récent : retrait obsolète
            });
          });
        }
        // 3. poolSeen local + recalcul des vus
        try { const ps = JSON.parse(localStorage.getItem("findeur-pool-seen") || "[]") || []; const set = new Set(); const out = []; ps.forEach((t) => { const ft = fixMojibake(t); if (ft !== t) changed = true; if (!set.has(ft)) { set.add(ft); out.push(ft); } }); localStorage.setItem("findeur-pool-seen", JSON.stringify(out)); } catch (e) {}

      };
      if (purgeMojibake()) save();
      if (prunePicks()) save(); // retirer de « À voir » les films vus depuis plus de 30 minutes

      const fmtH = (m) => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); };
      const fmtDur = (m) => Math.floor(m/60) + "h" + String(m%60).padStart(2,"0");
      const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      // pour les titres insérés dans les attributs onclick (guillemets simples) : neutralise aussi les apostrophes et backslashes
      const escAttr = (s) => esc(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");

      const budget = () => state.debutMin !== null && state.coucheMin !== null ? ((state.coucheMin - state.debutMin + 1440) % 1440) - 10 : null;

      const score = (f) => {
        const map = {
          calme: f.big ? 3 : 0,
          nerveux: (f.tags.includes("tension")||f.tags.includes("course")||f.tags.includes("nocturne")) ? 3 : 0,
          cerveau: (f.tags.includes("twist")||f.tags.includes("boucle")||f.tags.includes("IA")) ? 3 : 0,

        };
        return (map[state.envie] || 0) + (f.p.length > 1 ? 1 : 0) + noteBoost(f) +
          (f.p.some(p => ["Netflix", "Prime Video", "Sooner", "Cinéma", "Apple TV+"].includes(p)) ? 2 : 0); // accès facile privilégié
      };

      // commentaire personnel : proposé à côté de la note partout où les étoiles apparaissent
      window.removePick = (t) => { delete state.pickHistory[t]; save(); schedulePush(); render(); if (window.__picksOpen) openPicksModal(window.__picksMode || "selection"); };
      window.addComment = (t) => {
        const existing = (state.comments[t] || {}).text || "";
        const v = window.prompt("Ton commentaire sur ce film (ce qui t'a plu ou déplu : ambiance, rythme, réalisation… — il affinera ton profil cinéphile) :", existing);
        if (v === null) return; // annulé

        else delete state.comments[t];
        save(); schedulePush(); maybeRefreshSeen();
      };
      const stars = (film) => {
        const r = state.ratings[film.t]?.v ?? null;
        let h = `<div style="display:flex;align-items:center;gap:6px;white-space:nowrap"><div class="stars">`;
        h += `<button class="${r === 0 ? "thumb-on" : ""}" title="Vraiment pas aimé" onclick="setRating('${escAttr(film.t)}',0)">👎</button>`;
        for (let n = 1; n <= 3; n++) {
          h += `<button class="${r !== null && r >= n ? "on" : ""}" title="${NOTE_LABELS[n]}" onclick="setRating('${escAttr(film.t)}',${n})">${r !== null && r >= n ? "★" : "☆"}</button>`;
        }

      // Probabilité que le film plaise, d'après le profil cinéphile
      const proba = (f) => {
        let p = 50;
        const want = {
          calme: f.big ? 15 : 0,
          nerveux: (f.tags.includes("tension") || f.tags.includes("course") || f.tags.includes("nocturne")) ? 15 : 0,
          cerveau: (f.tags.includes("twist") || f.tags.includes("boucle") || f.tags.includes("IA")) ? 15 : 0,
          coeur: (f.tags.includes("romance") || f.tags.includes("memoire") || f.tags.includes("famille") || f.tags.includes("pere-fille")) ? 15 : 0,
        };
        p += want[state.envie] || 0;
        if (f.tags.includes("post-apo")) p += 10;
        if (f.tags.includes("huis clos") || f.tags.includes("claustro")) p += 8;
        if (f.tags.includes("twist") || f.tags.includes("boucle")) p += 6;
        if (f.tags.includes("IA")) p += 6;
        if (["Park Chan-wook", "Quentin Dupieux", "Safdie", "Denis Villeneuve", "Bong Joon-ho", "Gaspar Noé"].some((d) => f.r.includes(d))) p += 8;
        if (f.tags.includes("satire") || f.tags.includes("absurde") || f.tags.includes("faux doc")) p += 6;
        if (f.g === "horreur") p += 4;
        if (f.tags.includes("haneke")) p -= 20;
        if (f.g === "comedie" && f.y < 1990) p -= 15;
        if (f.p.length > 1) p += 3;

        Object.entries(state.comments || {}).forEach(([ct, cc]) => {

          if (!sim) return;
          if (rv <= 1) p -= 7; else if (rv === 3) p += 7;
        });
        return Math.max(5, Math.min(95, Math.round(p)));
      };

      const cardHTML = (f, i, opts) => {
        const b = budget();
        const ok = b === null || f.dur <= b;
        const fin = state.debutMin + f.dur;

        return `<div class="card ${ok ? "" : "toolong"}">

              ${b !== null ? (ok

                : `<div class="fit-ko">⛔ trop long : finirait vers ${fmtH(fin)} pour une fin prévue à ${fmtH(state.debutMin + b)}</div>`) : ""}
              <p class="pitch">${esc(f.pitch)}</p>
              <p class="why">💡 ${esc(f.why)}</p>
              ${vu
                ? '<div class="gauge-row" style="visibility:hidden"><span class="gauge-lbl">🎯 00 % de chances de te plaire</span><div class="gauge"><div class="gauge-fill" style="width:0%"></div></div></div>'
                : `<div class="gauge-row">
                <span class="gauge-lbl">🎯 ${proba(f)} % de chances de te plaire</span>
                <div class="gauge"><div class="gauge-fill" style="width:${proba(f)}%"></div></div>
              </div>`}
              ${f.g === "comedie" ? '<div><span class="chip green">VF disponible (exigée)</span></div>' : ""}
              <div class="dispo-live" data-title="${esc(f.t)}" data-year="${f.y || ""}">📡 Vérification des plateformes…</div>
            </div>
            <div class="poster" data-title="${esc(f.t)}" id="poster-${i}" style="align-self:flex-start">🎞️</div>
          </div>
          <div class="row">
            <div>
              <button class="toggle ${vu ? "on" : ""}" onclick="toggleVu('${escAttr(f.t)}')" title="${vu ? "Marquer comme pas vu" : "Marquer comme vu"}">

                ? `<button class="btn" title="Retirer ce film de ma liste « À voir »" onclick="removePick('${escAttr(f.t)}')">❌ Retirer de « À voir »</button>`
                : (state.pickHistory[f.t]

            </div>

      };

      // --- actions ---
      window.setDebut = (m) => { state.debutMin = m; state.noTime = false; save(); render(); };
