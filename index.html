      // v87 deep-link « À voir » : ?add=Titre (depuis un e-mail externe) ajoute le film à la liste « à voir »
      // v88 : bandeau explicatif quand le navigateur ouvert depuis l'e-mail n'a pas le token GitHub (synchro locale uniquement)
      (() => { try { const p = new URLSearchParams(location.search); const add = p.get("add"); if (add) { const t = add.trim(); if (t && !state.seen.includes(t)) { state.pickHistory[t] = state.pickHistory[t] || Date.now(); if (isPoolFilm(t)) adopt(t); save(); schedulePush(); } history.replaceState(null, "", location.pathname); setTimeout(() => { openPicksModal("all"); if (!getToken()) { const b = document.querySelector(".mbox"); if (b) b.insertAdjacentHTML("afterbegin", "<div class='picked' style='border-color:#b45309;background:#451a03;color:#fbbf24;margin-bottom:10px'>🌙 Bien ajouté à « À voir » — mais ce navigateur est hors ligne : l'ajout est enregistré uniquement sur cet appareil. Pour le synchroniser avec GitHub et tes autres navigateurs : bouton ⚙️ Synchronisation & réglages en bas de page → colle ton token GitHub (il est mémorisé séparément par chaque navigateur).</div>"); } }, 500); } } catch (e) {} })();
      loadPool().then(() => render()).catch(() => {});
      loadProfil().then(() => render()).catch(() => {});
      render();
      initSync();
    </script>
  </body>
</html>
