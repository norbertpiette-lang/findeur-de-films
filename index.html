      let state = { etape:0, debutMin:null, coucheMin:null, genre:null, envie:null, filters:{big:false, plateformes:[]}, seen:[], seenMap:{}, seenDel:{}, indispo:{}, comments:{}, pickHistory:{}, ratings:{}, pick:null };
      try { const saved = JSON.parse(localStorage.getItem(LS) || "null"); if (saved) state = Object.assign(state, saved, {pick:null}); } catch (e) {}
      // films vus avant cette session : cachés des suggestions ; ceux marqués vus pendant la session restent affichés pour être notés
      let sessionSeen = new Set(state.seen);
      const isSessionSeen = (t) => sessionSeen.has(t);
      const IND_DELAY = 90 * 864e5; // rétention indisponibilité : 3 mois
      // critères communs de sélection (utilisés par les suggestions ET la liste des films déjà vus)
      const SELECTION_OK = (f) => {
        const ALLOWED = ["Netflix", "Prime Video", "Apple TV+", "Sooner", "VOD", "Cinéma"];
        const isWE = [5, 6, 0].includes(new Date().getDay());
        return f.p.some(p => ALLOWED.includes(p)) &&
          !(f.p.includes("Cinéma") && !isWE) &&
          (!state.filters.big || f.big) &&
          (state.filters.plateformes.length === 0 || f.p.some(p => state.filters.plateformes.includes(p)));
      };
      // films déjà vus de l'ambiance courante : aucun filtre de plateforme appliqué (même actif)
      const seenInSelection = () => FILMS.filter((f) => f.g === state.genre && state.seen.includes(f.t));
      const isIndispo = (t) => (state.indispo?.[t] || 0) > 0 && Date.now() - state.indispo[t] < IND_DELAY;
      // migration ancien format : seen [] → seenMap avec horodatage 0
      if (!state.seenMap && Array.isArray(state.seen)) {
        state.seenMap = Object.fromEntries(state.seen.map((t) => [t, 0]));
        state.seenDel = state.seenDel || {};
      }
      // vu = ajouté plus récemment que retiré
      const recomputeSeen = () => {
        state.seen = Object.keys(state.seenMap || {}).filter((t) => (state.seenMap[t] || 0) > (state.seenDel?.[t] ?? -1));
      };
      recomputeSeen();

      const save = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} };

      const fmtH = (m) => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); };
      const fmtDur = (m) => Math.floor(m/60) + "h" + String(m%60).padStart(2,"0");
      const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      // pour les titres insérés dans les attributs onclick (guillemets simples) : neutralise aussi les apostrophes et backslashes
      const escAttr = (s) => esc(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");

      const budget = () => state.debutMin !== null && state.coucheMin !== null ? ((state.coucheMin - state.debutMin + 1440) % 1440) - 10 : null;

      const score = (f) => {
        const map = {
          calme: f.big ? 3 : 0,
          nerveux: (f.tags.includes("tension")||f.tags.includes("course")||f.tags.includes("nocturne")) ? 3 : 0,
          cerveau: (f.tags.includes("twist")||f.tags.includes("boucle")||f.tags.includes("IA")) ? 3 : 0,
          coeur: (f.tags.includes("romance")||f.tags.includes("memoire")||f.tags.includes("famille")||f.tags.includes("pere-fille")) ? 3 : 0,
        };
        return (map[state.envie] || 0) + (f.p.length > 1 ? 1 : 0) +
          (f.p.some(p => ["Netflix", "Prime Video", "Sooner", "Cinéma", "Apple TV+"].includes(p)) ? 2 : 0); // accès facile privilégié
      };

      const stars = (film) => {
        const r = state.ratings[film.t]?.v ?? null;
        let h = `<div style="display:flex;align-items:center;gap:6px;white-space:nowrap"><div class="stars">`;
        h += `<button class="${r === 0 ? "thumb-on" : ""}" title="Vraiment pas aimé" onclick="setRating('${escAttr(film.t)}',0)">👎</button>`;
        for (let n = 1; n <= 3; n++) {
          h += `<button class="${r !== null && r >= n ? "on" : ""}" title="${NOTE_LABELS[n]}" onclick="setRating('${escAttr(film.t)}',${n})">${r !== null && r >= n ? "★" : "☆"}</button>`;
        }
        h += `</div><span class="starlabel">${r !== null ? NOTE_LABELS[r] : "pas encore noté"}</span></div>`;
        return h;
      };

      // Probabilité que le film plaise, d'après le profil cinéphile
      const proba = (f) => {
        let p = 50;
        const want = {
          calme: f.big ? 15 : 0,
          nerveux: (f.tags.includes("tension") || f.tags.includes("course") || f.tags.includes("nocturne")) ? 15 : 0,
          cerveau: (f.tags.includes("twist") || f.tags.includes("boucle") || f.tags.includes("IA")) ? 15 : 0,
          coeur: (f.tags.includes("romance") || f.tags.includes("memoire") || f.tags.includes("famille") || f.tags.includes("pere-fille")) ? 15 : 0,
        };
        p += want[state.envie] || 0;
        if (f.tags.includes("post-apo")) p += 10;
        if (f.tags.includes("huis clos") || f.tags.includes("claustro")) p += 8;
        if (f.tags.includes("twist") || f.tags.includes("boucle")) p += 6;
        if (f.tags.includes("IA")) p += 6;
        if (["Park Chan-wook", "Quentin Dupieux", "Safdie", "Denis Villeneuve", "Bong Joon-ho", "Gaspar Noé"].some((d) => f.r.includes(d))) p += 8;
        if (f.tags.includes("satire") || f.tags.includes("absurde") || f.tags.includes("faux doc")) p += 6;
        if (f.g === "horreur") p += 4;
        if (f.tags.includes("haneke")) p -= 20;
        if (f.g === "comedie" && f.y < 1990) p -= 15;
        if (f.p.length > 1) p += 3;
        // affinage par commentaires : proximité (genre, tags, réalisateur) avec un film commenté et noté
        Object.entries(state.comments || {}).forEach(([ct, cc]) => {
          const src = FILMS.find((x) => x.t === ct);
          const rv = state.ratings[ct]?.v;
          if (!src || rv === undefined || rv === null) return;
          const sim = src.g === f.g || src.tags.some((tg) => f.tags.includes(tg)) || src.r === f.r;
          if (!sim) return;
          if (rv <= 1) p -= 7; else if (rv === 3) p += 7;
        });
        return Math.max(5, Math.min(95, Math.round(p)));
      };

      const cardHTML = (f, i) => {
        const b = budget();
        const ok = b === null || f.dur <= b;
        const fin = state.debutMin + f.dur;
        const genreLabel = GENRES.find(g => g.id === f.g).label.replace(/^\S+\s/, "");
        const vu = state.seen.includes(f.t);
        return `<div class="card ${ok ? "" : "toolong"}">
          <div style="display:flex;flex-direction:row;gap:12px;align-items:stretch;flex-wrap:nowrap">
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
              <div><div class="title">${esc(f.t)}</div>
              <div class="meta">${esc(f.r)} · ${f.y} · ${genreLabel} · ⏱️ ${fmtDur(f.dur)}</div>
              ${f.big ? '<span class="chip amber">🖥️ Mérite grand écran</span>' : ""}</div>
              ${b !== null ? (ok
                ? `<div class="fit-ok">✓ finit vers ${fmtH(fin)} (fin prévue ${fmtH(state.debutMin + b)})</div>`
                : `<div class="fit-ko">⛔ trop long : finirait vers ${fmtH(fin)} pour une fin prévue à ${fmtH(state.debutMin + b)}</div>`) : ""}
              <p class="pitch">${esc(f.pitch)}</p>
              <p class="why">💡 ${esc(f.why)}</p>
              ${vu
                ? '<div class="gauge-row" style="visibility:hidden"><span class="gauge-lbl">🎯 00 % de chances de te plaire</span><div class="gauge"><div class="gauge-fill" style="width:0%"></div></div></div>'
                : `<div class="gauge-row">
                <span class="gauge-lbl">🎯 ${proba(f)} % de chances de te plaire</span>
                <div class="gauge"><div class="gauge-fill" style="width:${proba(f)}%"></div></div>
              </div>`}
              <div>${f.p.map(p => `<span class="chip">${esc(p)}</span>`).join("")}${f.g === "comedie" ? '<span class="chip green">VF disponible (exigée)</span>' : ""}</div>
            </div>
            <div class="poster" data-title="${esc(f.t)}" id="poster-${i}" style="height:auto;align-self:stretch">🎞️</div>
          </div>
          <div class="row">
            <div>
              <button class="toggle ${vu ? "on" : ""}" onclick="toggleVu('${escAttr(f.t)}')" title="${vu ? "Marquer comme pas vu" : "Marquer comme vu"}">
                <span class="knob"></span>
                <span class="t-lbl l">Pas vu</span>
                <span class="t-lbl r">Vu</span>
              </button>
              ${vu ? "" : `<button class="btn primary" onclick="setPick('${escAttr(f.t)}')">🎬 À voir — c'est mon choix</button>`}
              <button class="btn ${isIndispo(f.t) ? "vu-on" : ""}" onclick="toggleIndispo('${escAttr(f.t)}')" title="${isIndispo(f.t) ? "Film masqué des suggestions pour 3 mois — clique pour le réafficher" : "Je ne trouve pas ce film : le masquer des suggestions pendant 3 mois"}">${isIndispo(f.t) ? "🚫 Indisponible (annuler)" : "🚫 Indisponible"}</button>
            </div>
            ${vu ? stars(f) : ""}
          </div>
        </div>`;
      };

      // --- actions ---
      window.setDebut = (m) => { state.debutMin = m; save(); render(); };
      window.setDebutInput = (v) => { if (!v || !v.includes(":")) return; const [h, mm] = v.split(":").map(Number); if (isNaN(h) || isNaN(mm)) return; state.debutMin = h*60+mm; save(); render(); };
      window.setCouche = (m) => { state.coucheMin = m; save(); render(); };
      window.setCoucheInput = (v) => { if (!v || !v.includes(":")) return; const [h, mm] = v.split(":").map(Number); if (isNaN(h) || isNaN(mm)) return; state.coucheMin = h*60+mm; save(); render(); };
      window.goEtape = (n) => { state.etape = n; window.__jumpTop = true; save(); render(); };
      window.setGenre = (g) => { state.genre = g; state.etape = 2; window.__jumpTop = true; save(); render(); };
      window.setEnvie = (e) => { state.envie = e; state.etape = 3; window.__jumpTop = true; save(); render(); };
      window.setPick = (t) => { state.pick = FILMS.find(f => f.t === t); if (state.pick) { state.pickHistory[t] = state.pickHistory[t] || Date.now(); } window.__jumpTop = true; save(); render(); };
      window.closePick = () => { state.pick = null; save(); render(); };
      window.toggleVu = (t) => {
        const now = Date.now();
        const vu = state.seen.includes(t);
        if (vu) { // retrait — horodaté pour que la sync ne le ressuscite pas
          state.seenDel[t] = now;
          delete state.seenMap[t];
        } else { // ajout
          state.seenMap[t] = now;
          delete state.seenDel[t];
        }
        recomputeSeen(); save(); schedulePush(); window.__keepScroll = true; render(); maybeRefreshSeen();
      };
      window.setRating = (t, v) => { state.ratings[t] = { v, at: Date.now() }; save(); schedulePush(); window.__keepScroll = true; render(); maybeRefreshSeen(); };
      window.setPickRating = (v) => { state.ratings[state.pick.t] = { v, at: Date.now() }; save(); schedulePush(); window.__keepScroll = true; render(); maybeRefreshSeen(); };
      window.toggleBig = () => { state.filters.big = !state.filters.big; save(); render(); };
      window.togglePlat = (p) => {
        state.filters.plateformes = state.filters.plateformes.includes(p)
          ? state.filters.plateformes.filter(x => x !== p)
          : [...state.filters.plateformes, p];
        save(); render();
      };
      window.toggleIndispo = (t) => {
        if (isIndispo(t)) delete state.indispo[t];
        else state.indispo[t] = Date.now();
        save(); schedulePush(); window.__keepScroll = true; render();
      };
      window.reset = () => { window.__jumpTop = true; state = { etape:0, debutMin:null, coucheMin:null, genre:null, envie:null, filters:{big:false, plateformes:[]}, seen:[], seenMap:{}, seenDel:{}, indispo:{}, comments:{}, pickHistory:{}, ratings:{}, pick:null };
        try { localStorage.removeItem(LS); } catch (e) {} render(); };

      // --- Synchronisation GitHub (dépôt privé findeur-films-data) ---
      const getToken = () => { try { return localStorage.getItem(SYNC.tokenKey) || ""; } catch (e) { return ""; } };
      const notesURL = () => `https://api.github.com/repos/${SYNC.owner}/${SYNC.dataRepo}/contents/${SYNC.path}?ref=${SYNC.branch}`;
      const mergeNotes = (remote) => {
        // fusion par horodatage : la modification la plus récente gagne (notes, ajouts ET retraits de « vu »)
        const merged = { ...state.ratings };
        Object.entries(remote.ratings || {}).forEach(([t, e]) => {
          const local = merged[t];
          if (!local || (e.at || 0) > (local.at || 0)) merged[t] = e;
        });
        state.ratings = merged;
        const mergeMap = (remoteMap, localMap) => {
          const out = { ...(remoteMap || {}) };
          Object.entries(localMap || {}).forEach(([t, at]) => {
            if (!(t in out) || (out[t] || 0) < (at || 0)) out[t] = at;
          });
          return out;
        };
        state.seenMap = mergeMap(remote.seenMap || Object.fromEntries((remote.seen || []).map((t) => [t, 0])), state.seenMap);
        state.seenDel = mergeMap(remote.seenDel, state.seenDel);
        state.indispo = mergeMap(remote.indispo, state.indispo);
        state.pickHistory = mergeMap(remote.pickHistory, state.pickHistory);
        const mergedC = { ...(state.comments || {}) };
        Object.entries(remote.comments || {}).forEach(([t, c]) => {
          const local = mergedC[t];
          if (!local || (c.at || 0) > (local.at || 0)) mergedC[t] = c;
        });
        state.comments = mergedC;
        recomputeSeen();
        save();
      };
      const ghGetNotes = async () => {
        const res = await fetch(notesURL(), { headers: { Authorization: "Bearer " + getToken(), Accept: "application/vnd.github+json" } });
        if (res.status === 404) return { ratings: {}, seen: [], seenMap: {}, seenDel: {}, sha: undefined };
        if (!res.ok) throw new Error("HTTP " + res.status);
        const j = await res.json();
        let notes = { ratings: {}, seen: [], seenMap: {}, seenDel: {} };
        try { notes = JSON.parse(atob(j.content.replace(/\n/g, ""))) || notes; } catch (e) {}
        notes.sha = j.sha;
        return notes;
      };
      const ghPutNotes = async (sha) => {
        const content = btoa(JSON.stringify({ ratings: state.ratings, seen: state.seen, seenMap: state.seenMap, seenDel: state.seenDel, indispo: state.indispo, comments: state.comments, pickHistory: state.pickHistory, updatedAt: new Date().toISOString() }, null, 2));
        const res = await fetch(notesURL(), {
          method: "PUT",
          headers: { Authorization: "Bearer " + getToken(), Accept: "application/vnd.github+json", "Content-Type": "application/json" },
          body: JSON.stringify({ message: "Synchronisation notes Findeur de Films", content, sha, branch: SYNC.branch })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
      };
      let pushTimer = null, pushing = false;
      window.schedulePush = () => {
        if (!getToken()) { syncStatus = "⚪ Hors ligne — notes locales uniquement (réglages ⚙️ en bas)"; render(); return; }
        clearTimeout(pushTimer);
        pushTimer = setTimeout(async () => {
          if (pushing) { schedulePush(); return; }
          pushing = true; syncStatus = "🟡 Synchronisation…"; render();
          try {
            const remote = await ghGetNotes();
            mergeNotes(remote);
            await ghPutNotes(remote.sha);
            syncStatus = "🟢 Synchronisé sur GitHub à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
          } catch (e) { syncStatus = "🔴 Erreur de synchronisation : " + e.message; }
          pushing = false; render();
        }, 3000);
      };
      window.syncNow = async () => {
        if (!getToken()) { render(); return; }
        syncStatus = "🟡 Synchronisation…"; render();
        try {
          const remote = await ghGetNotes();
          mergeNotes(remote);
          await ghPutNotes(remote.sha);
          syncStatus = "🟢 Synchronisé sur GitHub à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
        } catch (e) { syncStatus = "🔴 Erreur de synchronisation : " + e.message; }
        render();
      };
      window.saveToken = (val) => { try { localStorage.setItem(SYNC.tokenKey, val.trim()); } catch (e) {} syncNow(); };
      window.initSync = async () => { if (getToken()) await syncNow(); };

      // --- Fenêtre « J'ai vu un film » : ajout avec vérification du titre ---
      let __addResults = [], __addPicked = null, __addNote = null, __addTimer = null, __histTitles = [];
      const normTitle = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "").replace(/^iletaitunefois/, "");
      const pendingPicks = () => {
        const merged = new Map();
        Object.keys(state.pickHistory || {})
          .filter((t) => !state.seen.includes(t) && !state.ratings[t])
          .sort((a, b) => (state.pickHistory[b] || 0) - (state.pickHistory[a] || 0))
          .forEach((t) => {
            const k = normTitle(t);
            if (!merged.has(k)) merged.set(k, t);
            else {
              const cur = merged.get(k);
              // fusion de doublons/suspicions : privilégier le titre connu du catalogue
              if (!FILMS.find((f) => f.t === cur) && FILMS.find((f) => f.t === t)) merged.set(k, t);
            }
          });
        return [...merged.values()];
      };
      window.pickFromHistory = (i) => {
        if (i === "" || i === null || i === undefined) return;
        const t = __histTitles[Number(i)];
        const f = FILMS.find((x) => x.t === t) || { t, y: null };
        __addPicked = { t, y: f.y, src: "🎬 ton choix « À voir »" };
        const q = document.getElementById("add-q"); if (q) q.value = t;
        document.getElementById("add-picked").innerHTML = `<div class="picked">✅ Titre vérifié : <b>${esc(t)}</b>${f.y ? " (" + f.y + ")" : ""} — <small>🎬 ton choix « À voir »</small></div>`;
        document.getElementById("add-ok").disabled = false;
      };
      const cleanTitle = (t) => t.replace(/\s*\((?:film|movie)\)/i, "");
      const titleYear = (t) => { const m = t.match(/\((\d{4})\)/); return { t: cleanTitle(t.replace(/\s*\(\d{4}\)\s*/, "")), y: m ? Number(m[1]) : null }; };
      window.renderAddStars = (sel) => {
        let h = "";
        [["👎", 0], ["☆", 1], ["☆☆", 2], ["☆☆☆", 3]].forEach(([lbl, v]) => {
          const on = __addNote === v;
          h += `<button class="stars button ${v === 0 && on ? "thumb-on" : ""} ${v > 0 && on ? "on" : ""}" style="font-size:1.3rem;background:none;border:none;cursor:pointer;color:${on ? "#fbbf24" : "#475569"}" onclick="setAddNote(${v})">${v === 0 ? "👎" : (on ? "★".repeat(v) : lbl)}</button>`;
        });
        document.getElementById("add-stars").innerHTML = h + ` <span class="starlabel">${__addNote !== null ? NOTE_LABELS[__addNote] : "pas encore noté"}</span>`;
      };
      window.setAddNote = (v) => { __addNote = v; window.renderAddStars(); };
      window.openAddModal = () => {
        __addPicked = null; __addNote = null; __addResults = []; __histTitles = pendingPicks();
        const enAttente = __histTitles.length > 0
          ? `<div id="add-hist" style="margin-bottom:12px">
              <p class="lbl" style="margin:0 0 6px">🎬 Tes films « À voir » en attente :</p>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <select id="add-hist-sel" style="flex:1;min-width:200px;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:6px 10px;font-size:.85rem">
                  <option value="">— choisir un film « À voir »…</option>
                  ${__histTitles.map((t, i) => `<option value="${i}">${esc(t)}</option>`).join("")}
                </select>
                <button class="btn primary" onclick="pickFromHistory(document.getElementById('add-hist-sel').value)">Choisir</button>
              </div>
            </div>`
          : "";
        document.getElementById("modal-root").innerHTML = `
          <div class="mroot" onclick="if(event.target===this) closeAddModal()">
            <div class="mbox">
              <h2 style="margin:0 0 4px">➕ Un film que je viens de voir</h2>
              <p class="range" style="margin:0 0 10px">Tape le titre, puis choisis-le dans la liste : l'entrée n'est validable qu'avec un titre vérifié (catalogue + Wikipedia).</p>
              ${enAttente}
              <input type="text" id="add-q" placeholder="Titre du film…" oninput="onAddSearch(this.value)"
                style="width:100%;box-sizing:border-box;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:9px 12px;font-size:.9rem" />
              <div id="add-results"></div>
              <div id="add-picked"></div>
              <div style="margin-top:14px">
                <p style="font-size:.9rem;font-weight:600;margin:0 0 6px">Ta note :</p>
                <div id="add-stars" style="display:flex;align-items:center;gap:4px"></div>
              </div>
              <div style="margin-top:12px">
                <p style="font-size:.9rem;font-weight:600;margin:0 0 6px">Pourquoi ? <small style="font-weight:400;color:#94a3b8">— affinera ton profil et les suggestions</small></p>
                <textarea id="add-comment" rows="3" placeholder="Ce qui t'a plu ou déplu : ambiance, rythme, réalisation, acteurs, intrigue…"
                  style="width:100%;box-sizing:border-box;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:9px 12px;font-size:.85rem;font-family:inherit;resize:vertical"></textarea>
              </div>
              <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
                <button class="btn" onclick="closeAddModal()">Annuler</button>
                <button class="btn primary" id="add-ok" onclick="validateAdd()" disabled>Ajouter à mes films vus</button>
              </div>
            </div>
          </div>`;
        window.renderAddStars();
        document.getElementById("add-q").focus();
      };
      window.closeSeenModal = () => { window.__seenOpen = false; document.getElementById("modal-root").innerHTML = ""; };
      window.openSeenModal = () => {
        window.__seenOpen = true;
        const vus = seenInSelection();
        const genreLabel = GENRES.find((g) => g.id === state.genre).label;
        document.getElementById("modal-root").innerHTML = `
          <div class="mroot" onclick="if(event.target===this) closeSeenModal()">
            <div class="mbox" style="width:min(720px,96vw)">
              <h2 style="margin:0 0 4px">👁️ Films déjà vus — ${esc(genreLabel)}</h2>
              <p class="range" style="margin:0 0 12px">Corrige tes notes si besoin : un clic sur une étoile la change, un second clic sur la même valeur la retire. Bascule « Pas vu » pour le faire réapparaître dans les suggestions.</p>
              <div style="display:flex;flex-direction:column;gap:12px">
                ${vus.length
                  ? vus.map((f, i) => cardHTML(f, 900 + i)).join("")
                  : `<p class="range">Aucun film déjà vu dans cette ambiance pour l'instant.</p>`}
              </div>
              <div style="display:flex;justify-content:flex-end;margin-top:14px">
                <button class="btn primary" onclick="closeSeenModal()">Fermer</button>
              </div>
            </div>
          </div>`;
        loadPosters();
      };
      const maybeRefreshSeen = () => { if (window.__seenOpen) openSeenModal(); if (window.__picksOpen) openPicksModal(); };
      window.closePicksModal = () => { window.__picksOpen = false; document.getElementById("modal-root").innerHTML = ""; };
      window.openPicksModal = () => {
        window.__picksOpen = true;
        const picks = pendingPicks().map((t) => FILMS.find((f) => f.t === t)).filter(Boolean);
        document.getElementById("modal-root").innerHTML = `
          <div class="mroot" onclick="if(event.target===this) closePicksModal()">
            <div class="mbox" style="width:min(720px,96vw)">
              <h2 style="margin:0 0 4px">🎬 Mes films « À voir » (${picks.length})</h2>
              <p class="range" style="margin:0 0 12px">Films choisis lors de précédentes recommandations, du plus récent au plus ancien. Marque-les « Vu » une fois regardés — ils quittent alors cette liste et enrichissent ton profil.</p>
              <div style="display:flex;flex-direction:column;gap:12px">
                ${picks.length
                  ? picks.map((f, i) => cardHTML(f, 950 + i)).join("")
                  : `<p class="range">Aucun film « À voir » en attente — fais une recommandation et choisis un film !</p>`}
              </div>
              <div style="display:flex;justify-content:flex-end;margin-top:14px">
                <button class="btn primary" onclick="closePicksModal()">Fermer</button>
              </div>
            </div>
          </div>`;
        loadPosters();
      };
      window.closeAddModal = () => { document.getElementById("modal-root").innerHTML = ""; };
      window.openSyncModal = () => {
        const nbNotes = Object.keys(state.ratings).length;
        const nbComs = Object.keys(state.comments || {}).length;
        const nbInd = Object.keys(state.indispo || {}).filter((t) => isIndispo(t)).length;
        document.getElementById("modal-root").innerHTML = `
          <div class="mroot" onclick="if(event.target===this) closeAddModal()">
            <div class="mbox">
              <h2 style="margin:0 0 4px">⚙️ Synchronisation & réglages</h2>
              <p class="sessionline" style="margin:0 0 12px">${syncStatus}</p>
              <p class="lbl">Informations à synchroniser</p>
              ${pendingPicks().length > 0 ? `<p class="sessionline">🎬 À voir (choix en attente) : ${pendingPicks().map(esc).join(", ")}</p>` : ""}
              ${state.seen.length > 0 ? `<p class="sessionline">Marqués « vus » : ${state.seen.map(esc).join(", ")}</p>` : ""}
              ${nbNotes > 0 ? `<p class="sessionline">Notes : ${Object.entries(state.ratings).map(([t, e]) => `${esc(t)} ${e.v === 0 ? "👎 (vraiment pas aimé)" : "★".repeat(e.v) + "☆".repeat(3-e.v) + (e.v === 3 ? " ⭐(référence)" : "")}`).join(" · ")}</p>` : ""}
              ${nbComs > 0 ? `<p class="sessionline">Commentaires : ${nbComs}</p>` : ""}
              ${nbInd > 0 ? `<p class="sessionline">Masqués pour indisponibilité : ${nbInd}</p>` : ""}
              ${state.seen.length === 0 && nbNotes === 0 && nbComs === 0 ? `<p class="range">Session vide — rien à synchroniser pour l'instant.</p>` : ""}
              <p class="lbl" style="margin-top:14px">☁️ Token GitHub</p>
              ${getToken()
                ? `<p class="sessionline">✅ Token actif dans ce navigateur.</p>`
                : `<div style="display:flex;gap:6px;flex-wrap:wrap">
                     <input type="password" id="gh-token" placeholder="github_pat_… (droits Contents: read & write, dépôt findeur-films-data)" style="flex:1;min-width:220px;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:6px 10px;font-size:.8rem" />
                     <button class="btn primary" onclick="saveToken(document.getElementById('gh-token').value)">Activer la sync</button>
                   </div>`}
              <p class="lbl" style="margin-top:14px">🖼️ Clé API TMDB (affiches)</p>
              <p class="sessionline">${getTmdbKey() === TMDB_KEY ? "✅ Clé par défaut active" : "Clé personnalisée enregistrée"} — laisse vide pour la clé intégrée.</p>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <input type="password" id="tmdb-key" placeholder="clé API TMDB personnalisée (optionnel)…" style="flex:1;min-width:220px;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:6px 10px;font-size:.8rem" />
                <button class="btn" onclick="saveTmdbKey(document.getElementById('tmdb-key').value)">Enregistrer</button>
              </div>
              <p class="warn" style="margin-top:10px">Token et clé restent stockés uniquement dans ce navigateur. Une fois la sync active, tes notes partagent le même profil sur tous tes appareils et une tâche planifiée Vibe les intègre à ton profil cinéphile matin et soir.</p>
              <div style="display:flex;justify-content:space-between;gap:8px;margin-top:16px">
                <button class="btn" onclick="reset(); closeAddModal()">🗑️ Vider la session</button>
                <button class="btn primary" onclick="closeAddModal()">Fermer</button>
              </div>
            </div>
          </div>`;
      };
      window.onAddSearch = (q) => {
        clearTimeout(__addTimer);
        if (q.trim().length < 2) { document.getElementById("add-results").innerHTML = ""; return; }
        __addTimer = setTimeout(async () => {
          const ql = q.trim().toLowerCase();
          let list = [];
          FILMS.forEach((f) => { if (f.t.toLowerCase().includes(ql)) list.push({ t: f.t, y: f.y, src: "📚 catalogue" }); });
          try {
            const r = await fetch(`https://fr.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q.trim())}&limit=8&namespace=0&format=json&origin=*`);
            const j = await r.json();
            (j[1] || []).forEach((raw, i) => {
              const { t, y } = titleYear(raw);
              if (!list.some((x) => x.t === t)) list.push({ t, y, d: (j[2] || [])[i], src: "🌐 Wikipédia" });
            });
          } catch (e) { /* hors ligne : catalogue local seulement */ }
          __addResults = list.slice(0, 10);
          document.getElementById("add-results").innerHTML = __addResults.length
            ? __addResults.map((r, i) => `<button class="sugg" onclick="pickAdd(${i})"><b>${esc(r.t)}</b>${r.y ? " (" + r.y + ")" : ""} <small>${r.src}${r.d ? " — " + esc(String(r.d).slice(0, 90)) : ""}</small></button>`).join("")
            : `<p class="range" style="margin-top:8px">❌ Aucun film trouvé pour « ${esc(q)} » — vérifie l'orthographe.</p>`;
        }, 350);
      };
      window.pickAdd = (i) => {
        const r = __addResults[i];
        __addPicked = r;
        document.getElementById("add-picked").innerHTML = `<div class="picked">✅ Titre vérifié : <b>${esc(r.t)}</b>${r.y ? " (" + r.y + ")" : ""} — <small>${esc(r.src)}</small></div>`;
        document.getElementById("add-ok").disabled = false;
      };
      window.validateAdd = () => {
        if (!__addPicked) return;
        const t = __addPicked.t;
        const c = ((document.getElementById("add-comment") || {}).value || "").trim();
        if (c) state.comments[t] = { text: c, at: Date.now() };
        if (!state.seen.includes(t)) window.toggleVu(t);
        if (__addNote !== null) window.setRating(t, __addNote);
        if (c) { save(); schedulePush(); maybeRefreshSeen(); }
        window.closeAddModal();
        render();
      };

      const render = () => {
        const app = document.getElementById("app");
        let h = `<h1>🎬 Findeur de Films <span>— profil cinéphile Norbert</span></h1>
          <p class="sub">Dystopies, huis clos, horreur d'ambiance, Park Chan-wook & Noé, comédies noires récentes. Pas d'animation · comédies en VF · disponibilités à confirmer sur l'app.</p>
          <p style="margin-top:8px"><button class="btn primary" onclick="openAddModal()">➕ J'ai vu un film</button> <button class="btn" onclick="openPicksModal()">🎬 À voir</button></p>`;

        if (state.etape === 0) {
          const b = budget();
          h += `<h2>1️⃣ Ta séance ce soir : début et fin ?</h2>
            <div class="grid">
              <div class="slot"><p>🛋️ Début de la séance vers…</p>
                ${[1200,1230,1260,1290,1320].map(m => `<button class="btn ${state.debutMin === m ? "vu-on" : ""}" onclick="setDebut(${m})">${fmtH(m)}</button>`).join("")}
                ${state.debutMin !== null && ![1200,1230,1260,1290,1320].includes(state.debutMin) ? `<button class="btn vu-on" title="heure personnalisée enregistrée" onclick="setDebutInput('')">✅ ${fmtH(state.debutMin)}</button>` : ""}
                <input type="time" value="" oninput="setDebutInput(this.value)" onchange="setDebutInput(this.value)" />
              </div>
              <div class="slot"><p>🏁 Fin de la séance vers…</p>
                ${[1350,1380,1410,0,60].map((m,i) => `<button class="btn ${state.coucheMin === m ? "vu-on" : ""}" onclick="setCouche(${m})">${i < 3 ? fmtH(m) : fmtH(m) + " (+1j)"}</button>`).join("")}
                ${state.coucheMin !== null && ![1350,1380,1410,0,60].includes(state.coucheMin) ? `<button class="btn vu-on" title="heure personnalisée enregistrée" onclick="setCoucheInput('')">✅ ${fmtH(state.coucheMin)}${state.coucheMin < 720 ? " (+1j)" : ""}</button>` : ""}
                <input type="time" value="" oninput="setCoucheInput(this.value)" onchange="setCoucheInput(this.value)" />
              </div>
            </div>
            ${b !== null ? `<p class="budgetline">🎯 Créneau : ${fmtDur((state.coucheMin - state.debutMin + 1440) % 1440)} de séance → ${fmtDur(b)} de film max (marge 10 min).</p>` : ""}
            <p style="margin-top:16px"><button class="btn primary" ${state.debutMin === null || state.coucheMin === null ? "disabled" : ""} onclick="goEtape(1)">Continuer →</button></p>`;
        }

        if (state.etape === 1) {
          h += `<h2>2️⃣ Quelle ambiance ce soir ?</h2><div class="grid">` +
            GENRES.map(g => `<button class="btn-card" onclick="setGenre('${g.id}')"><b>${g.label}</b><small>${g.desc}</small></button>`).join("") +
            `</div><p style="margin-top:12px"><button class="backlink" onclick="goEtape(0)">← changer l'heure</button></p>`;
        }

        if (state.etape === 2) {
          h += `<h2>3️⃣ C'est quoi l'envie du moment ?</h2><div class="grid">` +
            ENVIES.map(e => `<button class="btn-card" onclick="setEnvie('${e.id}')"><b>${e.label}</b><small>${e.hint}</small></button>`).join("") +
            `</div><p style="margin-top:12px"><button class="backlink" onclick="goEtape(1)">← changer d'ambiance</button></p>`;
        }

        if (state.etape === 3 && !state.pick) {
          const b = budget();
          // Garantie de visionnage : chaque suggestion doit être disponible sur au moins une plateforme d'accès
          const ALLOWED = ["Netflix", "Prime Video", "Apple TV+", "Sooner", "VOD", "Cinéma"];
          // Films en salle : uniquement du vendredi au dimanche (préférence week-end du profil)
          const isWE = [5, 6, 0].includes(new Date().getDay());
          let results = FILMS.filter(f =>
            f.g === state.genre &&
            SELECTION_OK(f) &&
            !isIndispo(f.t) &&
            !isSessionSeen(f.t)
          );
          const masques = FILMS.filter(f => f.g === state.genre && isIndispo(f.t));
          results.sort((a, c) => {
            const okA = b === null || a.dur <= b ? 0 : 1, okC = b === null || c.dur <= b ? 0 : 1;
            return okA - okC || score(c) - score(a);
          });
          h += `<div class="row"><h2>4️⃣ ${results.length} suggestion${results.length > 1 ? "s" : ""} · ${GENRES.find(g => g.id === state.genre).label}</h2>
            <span class="range">⏰ séance ${fmtH(state.debutMin)} → fin ${fmtH(state.coucheMin)} · ${fmtDur(b)} max</span>
            <button onclick="reset()" title="Recommencer depuis le début" style="background:none;border:none;cursor:pointer;font-size:1.1rem;padding:2px 4px">🏠</button></div>
            <div class="filters">
              <label><input type="checkbox" ${state.filters.big ? "checked" : ""} onchange="toggleBig()"> 📽️ grand écran uniquement</label>
              ${PLATEFORMES.map(p => `<label><input type="checkbox" ${state.filters.plateformes.includes(p) ? "checked" : ""} onchange="togglePlat('${p}')"> ${p}</label>`).join("")}
            </div>
            <p class="range" style="margin-top:6px"><button class="btn" onclick="openSeenModal()">👁️ Films déjà vus (${seenInSelection().length})</button></p>
            <p class="range" style="margin-top:6px">${isWE
              ? "🍿 C'est le week-end : les sorties en salle (Pathé Palace Opéra · Grand Rex · Max Linder) sont incluses."
              : "🎟️ Les films en salle apparaissent ici du vendredi au dimanche — en semaine, uniquement streamings et VOD."}</p>
            ${masques.length > 0 ? `<p class="range">🚫 ${masques.length} film${masques.length > 1 ? "s" : ""} masqué${masques.length > 1 ? "s" : ""} pour indisponibilité : ${masques.map(m => `${esc(m.t)} (revient le ${new Date(state.indispo[m.t] + IND_DELAY).toLocaleDateString("fr-FR")})`).join(" · ")}</p>` : ""}<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">` +
            (results.length === 0 ? `<p class="range">Aucun film avec ces filtres — élargis ta sélection 😉</p>` :
              results.map(cardHTML).join("")) +
            `</div>`;
        }

        if (state.etape === 3 && state.pick) {
          const f = state.pick, b = budget();
          const r = state.ratings[f.t]?.v ?? 0;
          h += `<div class="pickbox">
            <div style="font-size:1.8rem">🍿</div>
            <h2 style="margin:4px 0">${esc(f.t)}</h2>
            <p class="meta">${esc(f.r)} · ${f.y}</p>
            <p class="fit-ok">⏱️ ${fmtDur(f.dur)} · commence ${fmtH(state.debutMin)} → finit vers ${fmtH(state.debutMin + f.dur)} (fin prévue ${fmtH(state.debutMin + b)})</p>
            <p class="pitch" style="margin-top:10px">${esc(f.pitch)}</p>
            <p class="fit-ok" style="font-weight:600">💡 ${esc(f.why)}</p>
            <div class="dispo">
              <p class="lbl">📡 Disponibilité (à confirmer sur l'app)</p>
              ${f.p.length > 0 ? f.p.map(p => `<span class="chip green">${p.includes("VOD") ? "💳 Location/achat VOD" : p === "Cinéma" ? "🎟️ Cinéma (Pathé Palace Opéra · Grand Rex · Max Linder)" : p === "Sooner" ? "🎬 Sooner" : "📺 " + esc(p)}</span>`).join("") +
                (f.g === "comedie" ? '<span class="chip green">VF requise — vérifie la piste VF</span>' : "")
                : `<p class="none">⚠️ Aucune plateforme identifiée — vérifie sur JustWatch France.</p>`}
            </div>
            ${f.big ? '<div style="margin-top:8px"><span class="chip amber">🖥️ Mérite le vidéoprojecteur</span></div>' : ""}
          </div>
          <div class="notebox">
            <p class="warn">🎬 Bon film ! Note-le après la séance via le bouton « ➕ J'ai vu un film » — ton profil cinéphile s'enrichira de ta note et de ton commentaire.</p>
            <p class="warn">⚠️ Confirme la disponibilité sur l'app de la plateforme (fiches VOD parfois fantômes).${f.g === "comedie" ? " Vérifie la VF." : ""}</p>
          </div>
          <p style="margin-top:14px">
            <button class="btn" onclick="closePick()">← Autres suggestions</button>
            <button class="btn primary" onclick="openAddModal()">➕ J'ai vu un film</button>
          </p>`;
        }
          h += `<footer>`;
          h += `<div class="dispo" style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <p class="sessionline" style="margin:0">${syncStatus}</p>
            ${getToken() ? `<button class="btn" onclick="syncNow()">🔄 Synchroniser maintenant</button>` : `<button class="btn primary" onclick="openSyncModal()">🔌 Activer la sync</button>`}
            <button class="btn" onclick="openSyncModal()" title="Réglages, données à synchroniser et clé TMDB">⋯</button>
          </div></footer>`;

        // anti-saut : conserver le défilement pour toute action ; seul un vrai changement d'écran remonte en haut
        const jump = window.__jumpTop === true;
        const sy = window.scrollY;
        app.innerHTML = h;
        window.scrollTo(0, jump ? 0 : sy);
        window.__jumpTop = false;
        loadPosters();
      };

      // Affiches (jackettes) via Wikipédia, avec cache local
      const POSTER_KEY = "findeur-posters";
      let posterCache = {};
      try { posterCache = JSON.parse(localStorage.getItem(POSTER_KEY) || "{}") || {}; } catch (e) {}
      const savePosterCache = () => { try { localStorage.setItem(POSTER_KEY, JSON.stringify(posterCache)); } catch (e) {} };
      const wikiPoster = async (t) => {
        for (const lang of ["fr", "en"]) {
          for (const q of [t, t + " (film)"]) {
            try {
              const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/` + encodeURIComponent(q));
              if (r.ok) { const j = await r.json(); if (j.thumbnail && j.thumbnail.source) return j.thumbnail.source; }
            } catch (e) { /* hors ligne */ }
          }
        }
        return null;
      };
      const TMDB_KEY = "1f366fc9375213d96f03b38003d4cea6";
      const getTmdbKey = () => { try { return localStorage.getItem("findeur-tmdb-key") || TMDB_KEY; } catch (e) { return TMDB_KEY; } };
      const tmdbPoster = async (t, y) => {
        const key = getTmdbKey();
        if (!key) return null;
        try {
          const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${key}&query=${encodeURIComponent(t)}&language=fr-FR`);
          if (!r.ok) return null;
          const j = await r.json();
          const hits = (j.results || []).filter(m => m.poster_path);
          const hit = y ? (hits.find(m => (m.release_date || "").startsWith(String(y))) || hits[0]) : hits[0];
          return hit ? "https://image.tmdb.org/t/p/w185" + hit.poster_path : null;
        } catch (e) { return null; }
      };
      const loadPosters = async () => {
        document.querySelectorAll(".poster").forEach(async (el) => {
          const t = el.dataset.title;
          if (!(t in posterCache)) {
            const y = (FILMS.find(f => f.t === t) || {}).y;
            posterCache[t] = (await tmdbPoster(t, y)) || (await wikiPoster(t));
            savePosterCache();
          }
          if (posterCache[t]) el.innerHTML = '<img src="' + posterCache[t] + '" alt="' + esc(t) + '" loading="lazy" />';
        });
      };
      window.saveTmdbKey = (val) => {
        try { localStorage.setItem("findeur-tmdb-key", val.trim()); } catch (e) {}
        posterCache = {}; try { localStorage.removeItem(POSTER_KEY); } catch (e) {}
        render();
      };

      render();
      initSync();
    </script>
  </body>
</html>
